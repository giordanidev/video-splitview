<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6b8a"/>
      <stop offset="1" stop-color="#10202a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="1" stop-color="#e8a33d"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="128" height="256"/></clipPath>
    <clipPath id="right"><rect x="128" y="0" width="128" height="256"/></clipPath>
    <clipPath id="outer"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#outer)">
    <rect width="256" height="256" fill="#0e1418"/>

    <!-- Metade esquerda: baixa resolução (blocos) -->
    <g clip-path="url(#left)">
      <rect x="0"   y="0"   width="32" height="32" fill="#173442"/>
      <rect x="32"  y="0"   width="32" height="32" fill="#1b4256"/>
      <rect x="64"  y="0"   width="32" height="32" fill="#1f4e64"/>
      <rect x="96"  y="0"   width="32" height="32" fill="#173442"/>

      <rect x="0"   y="32"  width="32" height="32" fill="#1b4256"/>
      <rect x="32"  y="32"  width="32" height="32" fill="#e8a33d"/>
      <rect x="64"  y="32"  width="32" height="32" fill="#c9821f"/>
      <rect x="96"  y="32"  width="32" height="32" fill="#1f4e64"/>

      <rect x="0"   y="64"  width="32" height="32" fill="#1f4e64"/>
      <rect x="32"  y="64"  width="32" height="32" fill="#173442"/>
      <rect x="64"  y="64"  width="32" height="32" fill="#1b4256"/>
      <rect x="96"  y="64"  width="32" height="32" fill="#15343f"/>

      <rect x="0"   y="96"  width="32" height="32" fill="#1c3a2c"/>
      <rect x="32"  y="96"  width="32" height="32" fill="#234a39"/>
      <rect x="64"  y="96"  width="32" height="32" fill="#1c3a2c"/>
      <rect x="96"  y="96"  width="32" height="32" fill="#17312a"/>

      <rect x="0"   y="128" width="32" height="32" fill="#234a39"/>
      <rect x="32"  y="128" width="32" height="32" fill="#1c3a2c"/>
      <rect x="64"  y="128" width="32" height="32" fill="#17312a"/>
      <rect x="96"  y="128" width="32" height="32" fill="#1c3a2c"/>

      <rect x="0"   y="160" width="32" height="32" fill="#17312a"/>
      <rect x="32"  y="160" width="32" height="32" fill="#1c3a2c"/>
      <rect x="64"  y="160" width="32" height="32" fill="#234a39"/>
      <rect x="96"  y="160" width="32" height="32" fill="#17312a"/>

      <rect x="0"   y="192" width="32" height="32" fill="#1c3a2c"/>
      <rect x="32"  y="192" width="32" height="32" fill="#17312a"/>
      <rect x="64"  y="192" width="32" height="32" fill="#1c3a2c"/>
      <rect x="96"  y="192" width="32" height="32" fill="#234a39"/>

      <rect x="0"   y="224" width="32" height="32" fill="#10241e"/>
      <rect x="32"  y="224" width="32" height="32" fill="#1c3a2c"/>
      <rect x="64"  y="224" width="32" height="32" fill="#17312a"/>
      <rect x="96"  y="224" width="32" height="32" fill="#1c3a2c"/>
    </g>

    <!-- Metade direita: alta resolução (suave) -->
    <g clip-path="url(#right)">
      <rect x="128" y="0" width="128" height="176" fill="url(#sky)"/>
      <circle cx="196" cy="84" r="30" fill="url(#sun)"/>
      <circle cx="196" cy="84" r="44" fill="#e8a33d" opacity="0.12"/>
      <path d="M128 176 Q162 146 194 172 T256 164 V256 H128 Z" fill="#234a39"/>
      <path d="M128 198 Q170 172 202 196 T256 190 V256 H128 Z" fill="#17312a"/>
    </g>

    <!-- Spliter central -->
    <rect x="126" y="0" width="4" height="256" fill="#e8a33d"/>
    <rect x="119" y="110" width="18" height="36" rx="7" fill="#e8a33d"/>
    <rect x="124" y="119" width="8" height="18" rx="3" fill="#0e1418"/>
  </g>

  <rect x="1.5" y="1.5" width="253" height="253" rx="55" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
</svg>
